name: DAG needs Block pipeline to run depedent jobs
ON: 
   workflow_dispatch:

jobs: 
  job-1:
    runs-on: ubuntu-22.04
    steps:
       - run: echo "this job1 this will be succes first"


  job-2:
    runs-on: ubuntu-22.04
    needs: 
     - job-1
    steps:
      run: echo "this job will only trigger once job1 succes" 


  job-3:
    run-on: ubuntu-22.04
    needs:
       - job-1
       - job-2
    steps:
      run: echo "this job will only trigger once job1 & job2 succes"   